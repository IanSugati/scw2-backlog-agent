name: Support Overview Refresh

on:
  schedule:
    # Daily at 5am UTC — support tickets move daily, and the run is cheap
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # Manual trigger button in GitHub Actions

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run support refresh
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python support_refresh.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add support.json
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "chore: refresh support overview data [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
